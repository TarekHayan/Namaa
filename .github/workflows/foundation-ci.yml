name: Foundation CI

on:
  workflow_dispatch:
    inputs:
      mobile_only:
        description: 'Run selected mobile suites without satisfying the final gate'
        type: boolean
        default: false
      android_suites:
        description: 'Optional JSON array of Android suites for a mobile-only run'
        type: string
        default: ''
      ios_suites:
        description: 'Optional JSON array of iOS suites for a mobile-only run'
        type: string
        default: ''
      include_linux:
        description: 'Include Linux in a focused run without satisfying the final gate'
        type: boolean
        default: false
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/foundation-ci.yml'
      - '.github/scripts/**'
      - 'android/**'
      - 'integration_test/**'
      - 'ios/**'
      - 'lib/**'
      - 'linux/**'
      - 'macos/**'
      - 'pubspec.lock'
      - 'pubspec.yaml'
      - 'specs/003-namaa-tasks/**'
      - 'specs/004-habits/**'
      - 'specs/005-mind-maps/**'
      - 'supabase/**'
      - 'test/**'
      - 'test_driver/**'
      - 'windows/**'

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}-${{ inputs.mobile_only && format('mobile-{0}', github.run_id) || 'full' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.8'
  SUPABASE_CLI_VERSION: '2.119.0'

jobs:
  quality:
    if: ${{ !inputs.mobile_only }}
    name: Quality and shared tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify source formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Verify mobile runner failure handling
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

      - name: Analyze
        run: flutter analyze

      - name: Run Foundation and Task unit, widget, and architecture tests
        run: flutter test --no-pub --reporter compact

  database-security:
    if: ${{ !inputs.mobile_only }}
    name: Supabase database and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase
        run: |
          bash .github/scripts/reserve-supabase-ports.sh
          supabase start -x mailpit

      - name: Verify Foundation and Task migrations, grants, RLS, and XP integrity
        run: supabase test db

  android:
    if: ${{ !inputs.mobile_only || inputs.android_suites != '[]' }}
    name: Android integration (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.mobile_only && inputs.android_suites || '["foundation-tasks","habits-mind-maps"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Android Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Install Android compile SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" 'platforms;android-36'

      - name: Prepare and verify Android emulator with bounded download retries
        timeout-minutes: 8
        run: python3 .github/scripts/prepare-android-emulator.py

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase and export its publishable key
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/reserve-supabase-ports.sh
          # These tests do not use mail capture.
          supabase start -x mailpit
          local_key="$(supabase status -o env | sed -n 's/^PUBLISHABLE_KEY=//p' | tr -d '\"')"
          test -n "$local_key"
          echo "::add-mask::$local_key"
          echo "NAMAA_LOCAL_SUPABASE_PUBLISHABLE_KEY=$local_key" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Foundation and Task integration suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_SUITE: ${{ matrix.suite }}
          NAMAA_STAGING_SUPABASE_URL: ${{ secrets.NAMAA_STAGING_SUPABASE_URL }}
          NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          NAMAA_STAGING_TEST_USER_A_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_A_EMAIL }}
          NAMAA_STAGING_TEST_USER_A_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_A_PASSWORD }}
          NAMAA_STAGING_TEST_USER_B_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_B_EMAIL }}
          NAMAA_STAGING_TEST_USER_B_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_B_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-android-integration.sh

  linux:
    if: ${{ !inputs.mobile_only || inputs.include_linux }}
    name: Linux integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux desktop and keyring dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev gnome-keyring dbus-x11 xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Enable Linux desktop and resolve dependencies
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase and export its publishable key
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/reserve-supabase-ports.sh
          supabase start -x mailpit
          local_key="$(supabase status -o env | sed -n 's/^PUBLISHABLE_KEY=//p' | tr -d '\"')"
          test -n "$local_key"
          echo "::add-mask::$local_key"
          echo "NAMAA_LOCAL_SUPABASE_PUBLISHABLE_KEY=$local_key" >> "$GITHUB_ENV"

      - name: Build Linux application
        run: flutter build linux --debug

      - name: Run Linux Foundation integration suite
        shell: bash
        env:
          NAMAA_STAGING_SUPABASE_URL: ${{ secrets.NAMAA_STAGING_SUPABASE_URL }}
          NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          NAMAA_STAGING_TEST_USER_A_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_A_EMAIL }}
          NAMAA_STAGING_TEST_USER_A_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_A_PASSWORD }}
          NAMAA_STAGING_TEST_USER_B_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_B_EMAIL }}
          NAMAA_STAGING_TEST_USER_B_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_B_PASSWORD }}
        run: |
          set -euo pipefail
          dbus-run-session -- xvfb-run -a bash -c '
            set -euo pipefail
            eval "$(printf "%s" "namaa-ci" | gnome-keyring-daemon --unlock)"
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            tests=(
              integration_test/foundation_migration_test.dart
              integration_test/foundation_offline_test.dart
              integration_test/foundation_platform_test.dart
              integration_test/foundation_sync_test.dart
              integration_test/tasks_offline_sync_test.dart
              integration_test/tasks_completion_sync_test.dart
              integration_test/tasks_checklist_history_test.dart
              integration_test/tasks_localized_route_test.dart
              integration_test/habits_offline_sync_test.dart
              integration_test/habits_streak_history_test.dart
              integration_test/habits_edit_delete_test.dart
              integration_test/habits_localized_route_test.dart
              integration_test/mind_maps_library_test.dart
              integration_test/mind_maps_editor_test.dart
              integration_test/mind_maps_task_link_test.dart
              integration_test/mind_maps_viewport_test.dart
              integration_test/mind_maps_offline_sync_test.dart
              integration_test/mind_maps_localized_route_test.dart
            )
            for test_file in "${tests[@]}"; do
              flutter test --no-pub \
                --dart-define="NAMAA_LOCAL_SUPABASE_PUBLISHABLE_KEY=$NAMAA_LOCAL_SUPABASE_PUBLISHABLE_KEY" \
                -d linux "$test_file" --reporter expanded
            done
            flutter test --no-pub \
              --dart-define="NAMAA_LOCAL_SUPABASE_PUBLISHABLE_KEY=$NAMAA_LOCAL_SUPABASE_PUBLISHABLE_KEY" \
              -d linux integration_test/foundation_supabase_test.dart \
              --name "production configuration|automated tests resolve|local Supabase Data API" \
              --reporter expanded
            flutter test --no-pub \
              --dart-define="NAMAA_SUPABASE_URL=$NAMAA_STAGING_SUPABASE_URL" \
              --dart-define="NAMAA_SUPABASE_PUBLISHABLE_KEY=$NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY" \
              --dart-define="NAMAA_STAGING_TEST_USER_A_EMAIL=$NAMAA_STAGING_TEST_USER_A_EMAIL" \
              --dart-define="NAMAA_STAGING_TEST_USER_A_PASSWORD=$NAMAA_STAGING_TEST_USER_A_PASSWORD" \
              --dart-define="NAMAA_STAGING_TEST_USER_B_EMAIL=$NAMAA_STAGING_TEST_USER_B_EMAIL" \
              --dart-define="NAMAA_STAGING_TEST_USER_B_PASSWORD=$NAMAA_STAGING_TEST_USER_B_PASSWORD" \
              -d linux integration_test/foundation_staging_supabase_test.dart \
              --reporter expanded
            flutter test --no-pub \
              --dart-define="NAMAA_SUPABASE_URL=$NAMAA_STAGING_SUPABASE_URL" \
              --dart-define="NAMAA_SUPABASE_PUBLISHABLE_KEY=$NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY" \
              --dart-define="NAMAA_STAGING_TEST_USER_A_EMAIL=$NAMAA_STAGING_TEST_USER_A_EMAIL" \
              --dart-define="NAMAA_STAGING_TEST_USER_A_PASSWORD=$NAMAA_STAGING_TEST_USER_A_PASSWORD" \
              --dart-define="NAMAA_STAGING_TEST_USER_B_EMAIL=$NAMAA_STAGING_TEST_USER_B_EMAIL" \
              --dart-define="NAMAA_STAGING_TEST_USER_B_PASSWORD=$NAMAA_STAGING_TEST_USER_B_PASSWORD" \
              -d linux integration_test/mind_maps_staging_sync_test.dart \
              --reporter expanded
          '

  windows:
    if: ${{ !inputs.mobile_only }}
    name: Windows integration
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Enable Windows desktop and resolve dependencies
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows application
        run: flutter build windows --debug

      - name: Run Windows Foundation and Task integration entry points
        shell: pwsh
        env:
          NAMAA_STAGING_SUPABASE_URL: ${{ secrets.NAMAA_STAGING_SUPABASE_URL }}
          NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          NAMAA_STAGING_TEST_USER_A_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_A_EMAIL }}
          NAMAA_STAGING_TEST_USER_A_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_A_PASSWORD }}
          NAMAA_STAGING_TEST_USER_B_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_B_EMAIL }}
          NAMAA_STAGING_TEST_USER_B_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_B_PASSWORD }}
        run: |
          $tests = @(
            'integration_test/foundation_migration_test.dart',
            'integration_test/foundation_offline_test.dart',
            'integration_test/foundation_platform_test.dart',
            'integration_test/foundation_sync_test.dart',
            'integration_test/tasks_offline_sync_test.dart',
            'integration_test/tasks_completion_sync_test.dart',
            'integration_test/tasks_checklist_history_test.dart',
            'integration_test/tasks_localized_route_test.dart',
            'integration_test/habits_offline_sync_test.dart',
            'integration_test/habits_streak_history_test.dart',
            'integration_test/habits_edit_delete_test.dart',
            'integration_test/habits_localized_route_test.dart',
            'integration_test/mind_maps_library_test.dart',
            'integration_test/mind_maps_editor_test.dart',
            'integration_test/mind_maps_task_link_test.dart',
            'integration_test/mind_maps_viewport_test.dart',
            'integration_test/mind_maps_offline_sync_test.dart',
            'integration_test/mind_maps_localized_route_test.dart'
          )
          foreach ($test in $tests) {
            flutter test --no-pub -d windows $test --reporter expanded
            if ($LASTEXITCODE -ne 0) { throw "Integration test failed: $test" }
          }
          flutter test --no-pub -d windows integration_test/foundation_supabase_test.dart --name 'production configuration|automated tests resolve' --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Supabase boundary tests failed on Windows' }
          flutter test --no-pub `
            --dart-define="NAMAA_SUPABASE_URL=$env:NAMAA_STAGING_SUPABASE_URL" `
            --dart-define="NAMAA_SUPABASE_PUBLISHABLE_KEY=$env:NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY" `
            --dart-define="NAMAA_STAGING_TEST_USER_A_EMAIL=$env:NAMAA_STAGING_TEST_USER_A_EMAIL" `
            --dart-define="NAMAA_STAGING_TEST_USER_A_PASSWORD=$env:NAMAA_STAGING_TEST_USER_A_PASSWORD" `
            --dart-define="NAMAA_STAGING_TEST_USER_B_EMAIL=$env:NAMAA_STAGING_TEST_USER_B_EMAIL" `
            --dart-define="NAMAA_STAGING_TEST_USER_B_PASSWORD=$env:NAMAA_STAGING_TEST_USER_B_PASSWORD" `
            -d windows integration_test/foundation_staging_supabase_test.dart --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Staging Supabase integration failed on Windows' }
          flutter test --no-pub `
            --dart-define="NAMAA_SUPABASE_URL=$env:NAMAA_STAGING_SUPABASE_URL" `
            --dart-define="NAMAA_SUPABASE_PUBLISHABLE_KEY=$env:NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY" `
            --dart-define="NAMAA_STAGING_TEST_USER_A_EMAIL=$env:NAMAA_STAGING_TEST_USER_A_EMAIL" `
            --dart-define="NAMAA_STAGING_TEST_USER_A_PASSWORD=$env:NAMAA_STAGING_TEST_USER_A_PASSWORD" `
            --dart-define="NAMAA_STAGING_TEST_USER_B_EMAIL=$env:NAMAA_STAGING_TEST_USER_B_EMAIL" `
            --dart-define="NAMAA_STAGING_TEST_USER_B_PASSWORD=$env:NAMAA_STAGING_TEST_USER_B_PASSWORD" `
            -d windows integration_test/mind_maps_staging_sync_test.dart --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Mind Maps staging sync failed on Windows' }

  macos:
    if: ${{ !inputs.mobile_only }}
    name: macOS integration
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Enable macOS desktop and resolve dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Build macOS application
        run: flutter build macos --debug

      - name: Run macOS Foundation and Task integration entry points
        shell: bash
        env:
          NAMAA_STAGING_SUPABASE_URL: ${{ secrets.NAMAA_STAGING_SUPABASE_URL }}
          NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          NAMAA_STAGING_TEST_USER_A_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_A_EMAIL }}
          NAMAA_STAGING_TEST_USER_A_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_A_PASSWORD }}
          NAMAA_STAGING_TEST_USER_B_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_B_EMAIL }}
          NAMAA_STAGING_TEST_USER_B_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_B_PASSWORD }}
        run: |
          set -euo pipefail
          tests=(
            integration_test/foundation_migration_test.dart
            integration_test/foundation_offline_test.dart
            integration_test/foundation_platform_test.dart
            integration_test/foundation_sync_test.dart
            integration_test/tasks_offline_sync_test.dart
            integration_test/tasks_completion_sync_test.dart
            integration_test/tasks_checklist_history_test.dart
            integration_test/tasks_localized_route_test.dart
            integration_test/habits_offline_sync_test.dart
            integration_test/habits_streak_history_test.dart
            integration_test/habits_edit_delete_test.dart
            integration_test/habits_localized_route_test.dart
            integration_test/mind_maps_library_test.dart
            integration_test/mind_maps_editor_test.dart
            integration_test/mind_maps_task_link_test.dart
            integration_test/mind_maps_viewport_test.dart
            integration_test/mind_maps_offline_sync_test.dart
            integration_test/mind_maps_localized_route_test.dart
          )
          for test_file in "${tests[@]}"; do
            flutter test --no-pub -d macos "$test_file" --reporter expanded
          done
          flutter test --no-pub -d macos integration_test/foundation_supabase_test.dart \
            --name 'production configuration|automated tests resolve' --reporter expanded
          flutter test --no-pub \
            --dart-define="NAMAA_SUPABASE_URL=$NAMAA_STAGING_SUPABASE_URL" \
            --dart-define="NAMAA_SUPABASE_PUBLISHABLE_KEY=$NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="NAMAA_STAGING_TEST_USER_A_EMAIL=$NAMAA_STAGING_TEST_USER_A_EMAIL" \
            --dart-define="NAMAA_STAGING_TEST_USER_A_PASSWORD=$NAMAA_STAGING_TEST_USER_A_PASSWORD" \
            --dart-define="NAMAA_STAGING_TEST_USER_B_EMAIL=$NAMAA_STAGING_TEST_USER_B_EMAIL" \
            --dart-define="NAMAA_STAGING_TEST_USER_B_PASSWORD=$NAMAA_STAGING_TEST_USER_B_PASSWORD" \
            -d macos integration_test/foundation_staging_supabase_test.dart \
            --reporter expanded
          flutter test --no-pub \
            --dart-define="NAMAA_SUPABASE_URL=$NAMAA_STAGING_SUPABASE_URL" \
            --dart-define="NAMAA_SUPABASE_PUBLISHABLE_KEY=$NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="NAMAA_STAGING_TEST_USER_A_EMAIL=$NAMAA_STAGING_TEST_USER_A_EMAIL" \
            --dart-define="NAMAA_STAGING_TEST_USER_A_PASSWORD=$NAMAA_STAGING_TEST_USER_A_PASSWORD" \
            --dart-define="NAMAA_STAGING_TEST_USER_B_EMAIL=$NAMAA_STAGING_TEST_USER_B_EMAIL" \
            --dart-define="NAMAA_STAGING_TEST_USER_B_PASSWORD=$NAMAA_STAGING_TEST_USER_B_PASSWORD" \
            -d macos integration_test/mind_maps_staging_sync_test.dart \
            --reporter expanded

  ios:
    if: ${{ !inputs.mobile_only || inputs.ios_suites != '[]' }}
    name: iOS simulator (${{ matrix.suite }})
    # Use the separate Intel pool while ARM runners have capacity delays.
    runs-on: macos-26-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        suite: ${{ fromJSON(inputs.mobile_only && inputs.ios_suites || '["migration","offline","platform","sync","staging-supabase","tasks-offline-sync","tasks-completion-sync","tasks-checklist-history","tasks-localized-route","habits-offline-sync","habits-streak-history","habits-edit-delete","habits-localized-route","mind-maps-library","mind-maps-editor","mind-maps-task-link","mind-maps-viewport","mind-maps-offline-sync","mind-maps-localized-route","mind-maps-staging-sync"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
          pub-cache: false

      - name: Resolve dependencies
        timeout-minutes: 5
        run: flutter pub get

      - name: Prefetch verified encrypted SQLite for the simulator
        timeout-minutes: 6
        run: python3 .github/scripts/prefetch-ios-sqlite.py --arch "${{ runner.arch }}"

      - name: Boot an available iPhone simulator
        timeout-minutes: 10
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | \
            python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          echo "device-id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Build iOS integration entry point for XCTest
        timeout-minutes: 40
        shell: bash
        env:
          IOS_DEVICE_ID: ${{ steps.simulator.outputs.device-id }}
          IOS_SUITE: ${{ matrix.suite }}
          NAMAA_STAGING_SUPABASE_URL: ${{ secrets.NAMAA_STAGING_SUPABASE_URL }}
          NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          NAMAA_STAGING_TEST_USER_A_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_A_EMAIL }}
          NAMAA_STAGING_TEST_USER_A_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_A_PASSWORD }}
          NAMAA_STAGING_TEST_USER_B_EMAIL: ${{ secrets.NAMAA_STAGING_TEST_USER_B_EMAIL }}
          NAMAA_STAGING_TEST_USER_B_PASSWORD: ${{ secrets.NAMAA_STAGING_TEST_USER_B_PASSWORD }}
        run: |
          set -euo pipefail
          case "$IOS_SUITE" in
            migration|offline|platform|sync|staging-supabase)
              test_file="integration_test/foundation_${IOS_SUITE//-/_}_test.dart"
              ;;
            tasks-*|habits-*|mind-maps-*)
              test_file="integration_test/${IOS_SUITE//-/_}_test.dart"
              ;;
            *) echo "Unknown iOS integration suite: $IOS_SUITE" >&2; exit 2 ;;
          esac
          test -f "$test_file"
          staging_defines=(
            --dart-define="NAMAA_SUPABASE_URL=$NAMAA_STAGING_SUPABASE_URL"
            --dart-define="NAMAA_SUPABASE_PUBLISHABLE_KEY=$NAMAA_STAGING_SUPABASE_PUBLISHABLE_KEY"
            --dart-define="NAMAA_STAGING_TEST_USER_A_EMAIL=$NAMAA_STAGING_TEST_USER_A_EMAIL"
            --dart-define="NAMAA_STAGING_TEST_USER_A_PASSWORD=$NAMAA_STAGING_TEST_USER_A_PASSWORD"
            --dart-define="NAMAA_STAGING_TEST_USER_B_EMAIL=$NAMAA_STAGING_TEST_USER_B_EMAIL"
            --dart-define="NAMAA_STAGING_TEST_USER_B_PASSWORD=$NAMAA_STAGING_TEST_USER_B_PASSWORD"
          )
          # Xcode logs can include the encoded Dart defines from Generated.xcconfig.
          python3 - "${staging_defines[@]}" <<'PY'
          import base64, sys
          for argument in sys.argv[1:]:
              value = argument.removeprefix('--dart-define=')
              print('::add-mask::' + base64.b64encode(value.encode()).decode())
          PY
          mkdir -p build/ios_integration
          # XCTest can activate native accessibility after the first test begins.
          # Establish it before testWidgets records its semantics-handle baseline.
          cat > build/ios_integration/entrypoint.dart <<DART
          import 'package:integration_test/integration_test.dart';

          import '../../$test_file' as scenario;
          import '../../test/support/native_ios_test_binding.dart';

          void main() {
            final binding = IntegrationTestWidgetsFlutterBinding.ensureInitialized();
            stabilizeNativeIosSemantics(binding);
            scenario.main();
          }
          DART
          flutter build ios --simulator --debug --no-codesign --no-pub --config-only \
            "${staging_defines[@]}" --target=build/ios_integration/entrypoint.dart
          python3 .github/scripts/run-ios-integration.py --build-only -- \
            xcodebuild -quiet build-for-testing -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$IOS_DEVICE_ID" \
            -derivedDataPath "$PWD/build/ios_integration/DerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ONLY_ACTIVE_ARCH=YES

      - name: Run iOS integration entry point through XCTest
        timeout-minutes: 15
        shell: bash
        env:
          IOS_DEVICE_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          set -euo pipefail
          result_bundle="$PWD/build/ios_integration/results.xcresult"
          # Native XCTest receives Dart results through the integration_test plugin;
          # it does not wait for discovery of a debugger VM-service URI.
          # Ad-hoc simulator signing preserves the host app's Keychain identity.
          python3 .github/scripts/run-ios-integration.py "$result_bundle" -- \
            xcodebuild -quiet test-without-building -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath "$PWD/build/ios_integration/DerivedData" \
            -destination "id=$IOS_DEVICE_ID" -parallel-testing-enabled NO \
            -only-testing:RunnerTests/RunnerTests/testFlutterIntegration \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            -resultBundlePath "$result_bundle" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ONLY_ACTIVE_ARCH=YES

  foundation-gate:
    name: Foundation and Task five-target gate
    if: ${{ always() && !inputs.mobile_only }}
    needs:
      - quality
      - database-security
      - android
      - linux
      - windows
      - macos
      - ios
    runs-on: ubuntu-latest
    steps:
      - name: Require every Foundation and Task job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DATABASE_RESULT: ${{ needs.database-security.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$QUALITY_RESULT" \
            "$DATABASE_RESULT" \
            "$ANDROID_RESULT" \
            "$LINUX_RESULT" \
            "$WINDOWS_RESULT" \
            "$MACOS_RESULT" \
            "$IOS_RESULT"; do
            test "$result" = success
          done
