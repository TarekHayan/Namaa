name: namma_project
description: "Namaa application foundation: app shell, encrypted local-first persistence, and synchronization infrastructure."
publish_to: 'none' # Private application; never publish to pub.dev.

version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Sorted alphabetically (sort_pub_dependencies). Approved Foundation direction
# only; every entry has a present use case (Constitution VIII).
dependencies:
  # Local-first encrypted persistence (Constitution III/IX: Drift over SQLite).
  drift: ^2.34.4
  drift_flutter: ^0.3.1

  flutter:
    sdk: flutter

  # Presentation state (Constitution VI: BLoC/Cubit).
  flutter_bloc: ^9.1.1

  flutter_localizations:
    sdk: flutter

  # OS-protected storage for credentials and database key material (Constitution IX).
  flutter_secure_storage: ^11.0.0

  # Immutable value types and payload serialization.
  freezed_annotation: ^3.1.0

  # Composition root (Constitution: get_it/injectable).
  get_it: ^9.2.1

  # Application routing.
  go_router: ^17.5.0
  injectable: ^3.0.0
  intl: ^0.20.2
  json_annotation: ^4.12.0

  # Remote infrastructure only; used exclusively by core/data/cloud adapters
  # behind the Cloud Session and Cloud Sync ports (Constitution: Supabase).
  supabase_flutter: ^2.17.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  injectable_generator: ^3.0.2

  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1

# Encrypted SQLite: package:sqlite3 build hooks bundle the SQLite3MultipleCiphers
# build (SQLCipher-compatible `PRAGMA key`, MIT license, no OpenSSL linkage on
# Windows/Linux/Android). The retired sqlcipher_flutter_libs package is a no-op
# stub since sqlite3 3.x and must not be used.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  # Enables ARB/gen_l10n generation configured in l10n.yaml (Constitution:
  # Arabic/English and RTL).
  generate: true
  uses-material-design: true
